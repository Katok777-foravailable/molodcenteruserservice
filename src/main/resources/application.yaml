spring:
  application:
    name: molodcenteruserservice

  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_DATABASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

servers:
  molodcenter: "localhost:8081"

feign:
  client:
    config:
      default:
        dismiss404: true

scheduler:
  user-event:
    limit: 500
    cron: "0 0 4 * * *"